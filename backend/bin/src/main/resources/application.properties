spring.application.name=auth-api

# ===== JWT =====
# Chave secreta HMAC-SHA256 (minimo 32 bytes). Em producao, defina a variavel
# de ambiente JWT_SECRET; o valor abaixo e apenas para desenvolvimento.
jwt.secret=${JWT_SECRET:chave-secreta-super-grande-para-o-nosso-jwt-2026}
# Tempo de vida do Access Token em milissegundos (1 hora)
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Descomente para ver o passo a passo dos filtros do Spring Security
#logging.level.org.springframework.security=DEBUG
