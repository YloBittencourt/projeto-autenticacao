<div class="page-container">
  <div class="card">
    <h2>Acesse sua conta</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Digite seu e-mail"
          autocomplete="username"
          [class.invalid]="campoInvalido('email')"
        >
        @if (campoInvalido('email')) {
          <div class="error-message">Insira um e-mail válido.</div>
        }
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          [class.invalid]="campoInvalido('password')"
        >
        @if (campoInvalido('password')) {
          <div class="error-message">A senha deve ter pelo menos 6 caracteres.</div>
        }
      </div>

      @if (mensagemErro()) {
        <div class="alert-error" role="alert">{{ mensagemErro() }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="hint">
      Usuário de teste: <strong>aluno&#64;email.com</strong> / <strong>123456</strong>
    </p>
  </div>
</div>
