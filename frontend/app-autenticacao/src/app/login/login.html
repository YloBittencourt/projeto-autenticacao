<div class="login-container">
  <div class="login-card">
    <h2>Acesse sua conta</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Campo de E-mail -->
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="Digite seu e-mail"
        >
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Insira um e-mail válido.
        </div>
      </div>

      <!-- Campo de Senha -->
      <div class="form-group">
        <label for="password">Senha</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="Digite sua senha"
        >
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          A senha deve ter pelo menos 6 caracteres.
        </div>
      </div>

      <!-- Esqueci a senha -->
      <div class="forgot-password">
        <a href="javascript:void(0)" (click)="onForgotPassword()">Esqueci minha senha</a>
      </div>

      <!-- Botão de Entrar -->
      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
        Entrar
      </button>

      <button
  	 type="button"
  	 class="btn-secondary"
 	 (click)="testarAutenticacao()"
      >
         Testar autenticação
      </button>
      <!-- Mensagem de sucesso (temporaria) -->
      <div class="success-log-message" *ngIf="mostrarMensagemLog">
        Dados impressos no console log
      </div>
    </form>

    <hr>

    <!-- Criar Conta -->
    <div class="register-section">
      <p>Ainda não tem acesso?</p>
      <button type="button" class="btn-secondary" (click)="onCreateAccount()">
        Criar conta
      </button>
    </div>
  </div>
</div>
